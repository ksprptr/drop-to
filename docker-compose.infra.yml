# docker-compose.infra.yml
# Infrastructure services only — for local development where apps run natively.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   pnpm dev   # apps run directly and connect to localhost ports

services:
  dropto-pg:
    image: postgres:17-alpine
    container_name: dropto-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASS}'
      POSTGRES_DB: '${DB_NAME}'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - dropto_pg_data:/var/lib/postgresql/data
    networks:
      - dropto_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dropto_pg_data:

networks:
  dropto_net:
    driver: bridge
    name: dropto_net
