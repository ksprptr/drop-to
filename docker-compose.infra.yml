# docker-compose.infra.yml
# Infrastructure services only — for local development where apps run natively.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   pnpm dev   # apps run directly and connect to localhost ports

services:
  dropto-pg:
    image: postgres:17-alpine
    container_name: dropto-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASS}'
      POSTGRES_DB: '${DB_NAME}'
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    volumes:
      - dropto_pg_data:/var/lib/postgresql/data
    networks:
      - dropto_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  dropto-redis:
    image: redis:7-alpine
    container_name: dropto-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASS}']
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - dropto_redis_data:/data
    networks:
      - dropto_net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASS}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dropto_pg_data:
  dropto_redis_data:

networks:
  dropto_net:
    driver: bridge
    name: dropto_net
